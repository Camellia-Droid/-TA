<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>与 TA</title>
  <style>
    :root {
      --warm-bg: #faf6f1;
      --warm-bg-deep: #2d2620;
      --warm-card: #fffaf5;
      --warm-card-strong: #ffffff;
      --warm-card-glass: rgba(255, 250, 245, 0.92);
      --warm-text: #3d322b;
      --warm-text-soft: #8a7a6e;
      --warm-text-faint: rgba(61, 50, 43, 0.38);
      --warm-accent: #d4846a;
      --warm-accent-deep: #c4745e;
      --warm-accent-light: #e8a894;
      --warm-accent-bg: rgba(212, 132, 106, 0.1);
      --warm-line: rgba(255, 248, 240, 0.8);
      --warm-border: rgba(139, 118, 102, 0.18);
      --warm-border-strong: rgba(139, 118, 102, 0.28);
      --warm-shadow: rgba(61, 50, 43, 0.08);
      --warm-shadow-lg: rgba(61, 50, 43, 0.16);
      --warm-danger: #c45a5a;
      --nav-height: 60px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--warm-bg);
      color: var(--warm-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-weight: 400;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: none;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.015);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #splashPage {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(212, 132, 106, 0.12), transparent),
        radial-gradient(ellipse 60% 50% at 70% 80%, rgba(180, 140, 110, 0.08), transparent),
        var(--warm-bg-deep);
    }

    #splashCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .splash-title {
      position: absolute;
      top: 16%;
      left: 50%;
      margin: 0;
      color: #fff8f0;
      font-size: clamp(52px, 12vw, 120px);
      font-weight: 200;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      line-height: 1;
      opacity: 0;
      transform: translate(-50%, 16px);
      transition: opacity 1s ease, transform 1s ease;
      user-select: none;
      text-shadow: 0 2px 30px rgba(212, 132, 106, 0.25);
    }

    .enter-button {
      position: absolute;
      left: 50%;
      bottom: 12%;
      min-width: 156px;
      height: 50px;
      padding: 0 38px;
      border: 1.5px solid rgba(255, 248, 240, 0.55);
      border-radius: 999px;
      background: rgba(255, 248, 240, 0.06);
      color: #fff8f0;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      cursor: pointer;
      opacity: 0;
      transform: translate(-50%, 16px);
      transition: opacity 1s ease, transform 1s ease, background 0.35s ease,
        color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .enter-button:hover,
    .enter-button:focus-visible {
      background: rgba(255, 248, 240, 0.92);
      color: var(--warm-text);
      border-color: rgba(255, 248, 240, 0.92);
      outline: none;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
    }

    #splashPage.ready .splash-title,
    #splashPage.ready .enter-button {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #registerPage {
      display: grid;
      place-items: center;
      padding: 24px 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(212, 132, 106, 0.08), transparent),
        var(--warm-bg);
    }

    .register-bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.22;
      filter: blur(0.5px);
    }

    #registerPage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(250, 246, 241, 0.55), rgba(250, 246, 241, 0.78));
      pointer-events: none;
    }

    .register-wrap,
    .home-panel,
    .detail-panel {
      position: relative;
      z-index: 1;
      width: min(90vw, 400px);
      margin: 0 auto;
      border-radius: 32px;
      background: var(--warm-card-glass);
      color: var(--warm-text);
      box-shadow:
        0 8px 32px var(--warm-shadow),
        0 2px 8px var(--warm-shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .register-wrap {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 22px;
      padding: 42px 28px 28px;
    }

    .register-title {
      margin: 0 0 6px;
      text-align: center;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-indent: 0.15em;
      line-height: 1.1;
      color: var(--warm-text);
    }

    .register-title::after {
      content: "";
      display: block;
      width: 32px;
      height: 2px;
      margin: 10px auto 0;
      border-radius: 2px;
      background: var(--warm-accent-light);
    }

    .avatar {
      position: relative;
      width: 114px;
      height: 114px;
      margin: 4px auto 8px;
      border: 2px dashed var(--warm-border);
      border-radius: 50%;
      background: rgba(212, 132, 106, 0.04);
      overflow: hidden;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
    }

    .avatar:hover,
    .avatar:focus-within {
      border-color: var(--warm-accent-light);
      background: rgba(212, 132, 106, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 132, 106, 0.12);
    }

    .avatar input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar.has-image img {
      display: block;
    }

    .avatar.has-image svg {
      display: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label {
      color: var(--warm-text-soft);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding-left: 4px;
    }

    .text-input {
      width: 100%;
      height: 50px;
      padding: 0 20px;
      border: 1.5px solid var(--warm-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.6);
      color: var(--warm-text);
      font-size: 16px;
      font-weight: 400;
      outline: none;
      transition: border-color 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
    }

    .text-input::placeholder {
      color: var(--warm-text-faint);
    }

    .text-input:focus {
      border-color: var(--warm-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(212, 132, 106, 0.1);
    }

    .gender-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .gender-option {
      height: 48px;
      border: 1.5px solid var(--warm-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--warm-text-soft);
      cursor: pointer;
      font-size: 15px;
      font-weight: 400;
      transition: border-color 0.35s ease, background 0.35s ease, color 0.35s ease,
        transform 0.35s ease, box-shadow 0.35s ease;
    }

    .gender-option:hover,
    .gender-option:focus-visible {
      border-color: var(--warm-accent-light);
      outline: none;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212, 132, 106, 0.08);
    }

    .gender-option.selected {
      border-color: var(--warm-accent);
      background: var(--warm-accent);
      color: #fff;
      box-shadow: 0 4px 16px rgba(212, 132, 106, 0.25);
    }

    .primary-button {
      width: 100%;
      height: 54px;
      margin-top: 6px;
      border-radius: 999px;
      background: var(--warm-accent);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      box-shadow: 0 6px 20px rgba(212, 132, 106, 0.3);
      transition: background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
    }

    .primary-button:hover,
    .primary-button:focus-visible {
      background: var(--warm-accent-deep);
      outline: none;
      box-shadow: 0 10px 32px rgba(212, 132, 106, 0.38);
    }

    .primary-button:active,
    .gender-option:active,
    .enter-button:active,
    .fab-button:active,
    .card:active {
      transform: scale(0.97);
    }

    .hint {
      min-height: 20px;
      margin: -8px 0 0;
      color: var(--warm-danger);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .hint.show {
      opacity: 1;
    }

    #homePage,
    #detailPage {
      background:
        radial-gradient(ellipse 70% 48% at 12% 0%, rgba(232, 168, 148, 0.16), transparent),
        radial-gradient(ellipse 55% 42% at 92% 16%, rgba(246, 215, 176, 0.42), transparent),
        linear-gradient(180deg, #fffaf5 0%, var(--warm-bg) 52%, #f6eee6 100%);
    }

    .app-shell {
      min-height: 100%;
      padding: 0 20px 110px;
    }

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 5;
      height: var(--nav-height);
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      max-width: 760px;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(180deg, rgba(255, 250, 245, 0.92), rgba(255, 250, 245, 0.68) 72%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-avatar-button,
    .back-button,
    .share-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--warm-text);
      box-shadow: 0 4px 14px var(--warm-shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .nav-avatar-button:hover,
    .back-button:hover,
    .share-button:hover {
      transform: translateY(-1px);
      background: #fff;
      box-shadow: 0 7px 18px var(--warm-shadow-lg);
    }

    .nav-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--warm-accent-bg);
    }

    .nav-avatar img,
    .sidebar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .nav-avatar.has-image img,
    .sidebar-avatar.has-image img {
      display: block;
    }

    .nav-avatar.has-image svg,
    .sidebar-avatar.has-image svg {
      display: none;
    }

    .nav-title {
      margin: 0;
      text-align: center;
      color: var(--warm-text);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home-content,
    .detail-content {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 0 0;
    }

    .hero {
      margin-bottom: 28px;
    }

    .hero h2 {
      margin: 0;
      color: var(--warm-text);
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--warm-text-soft);
      font-size: 15px;
      letter-spacing: 0.04em;
    }

    .notebook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 188px;
      padding: 12px;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 8px 24px rgba(61, 50, 43, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      outline: none;
      box-shadow: 0 14px 34px rgba(61, 50, 43, 0.13);
    }

    .card-cover {
      height: 86px;
      border-radius: 13px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .card-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 22% 24%, rgba(255, 255, 255, 0.36), transparent 22%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
    }

    .card-name {
      margin: 0;
      color: var(--warm-text);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .card-meta {
      margin: 8px 0 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--warm-text-soft);
      font-size: 12px;
    }

    .empty-state {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      color: var(--warm-text-soft);
    }

    .empty-illustration {
      width: 168px;
      height: 142px;
      filter: drop-shadow(0 10px 20px rgba(61, 50, 43, 0.08));
    }

    .empty-state p {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    .fab-button {
      position: fixed;
      left: 50%;
      bottom: calc(26px + env(safe-area-inset-bottom));
      z-index: 8;
      min-width: 172px;
      height: 56px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--warm-accent);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(212, 132, 106, 0.36);
      transform: translateX(-50%);
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .fab-button:hover,
    .fab-button:focus-visible {
      background: var(--warm-accent-deep);
      outline: none;
      box-shadow: 0 16px 40px rgba(212, 132, 106, 0.42);
      transform: translateX(-50%) translateY(-2px);
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(61, 50, 43, 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, background 0.3s ease;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
      background: rgba(61, 50, 43, 0.22);
    }

    .sidebar {
      width: min(82vw, 310px);
      height: 100%;
      padding: calc(42px + env(safe-area-inset-top)) 28px 28px;
      border-radius: 0 28px 28px 0;
      background: #fffaf5;
      box-shadow: 18px 0 48px rgba(61, 50, 43, 0.16);
      transform: translateX(-104%);
      transition: transform 0.35s ease;
    }

    .sidebar-overlay.open .sidebar {
      transform: translateX(0);
    }

    .sidebar-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--warm-accent-bg);
      border: 3px solid rgba(212, 132, 106, 0.18);
      box-shadow: 0 10px 24px rgba(212, 132, 106, 0.12);
    }

    .sidebar-name {
      margin: 18px 0 4px;
      color: var(--warm-text);
      font-size: 26px;
      font-weight: 800;
      word-break: break-word;
    }

    .sidebar-gender {
      margin: 0;
      color: var(--warm-text-soft);
      font-size: 14px;
    }

    .sidebar-divider {
      height: 1px;
      margin: 28px 0;
      background: var(--warm-border);
    }

    .logout-button {
      display: block;
      width: 100%;
      margin-bottom: 16px;
      padding: 0;
      background: transparent;
      color: var(--warm-text-soft);
      cursor: pointer;
      font-size: 15px;
      text-align: left;
      transition: color 0.3s ease;
    }

    .logout-button:hover {
      color: var(--warm-accent);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(61, 50, 43, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(100%, 380px);
      padding: 26px;
      border-radius: 20px;
      background: #fffaf5;
      box-shadow: 0 18px 60px rgba(61, 50, 43, 0.18);
      transform: translateY(12px) scale(0.98);
      transition: transform 0.3s ease;
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal h3 {
      margin: 0 0 20px;
      color: var(--warm-text);
      font-size: 22px;
      font-weight: 800;
    }

    .color-picker {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .color-dot {
      width: 34px;
      height: 34px;
      margin: 0 auto;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: 0 4px 12px rgba(61, 50, 43, 0.1);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .color-dot.selected {
      border-color: #fff;
      outline: 2px solid var(--warm-accent);
      transform: scale(1.08);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .secondary-button,
    .confirm-button {
      height: 46px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
    }

    .secondary-button {
      background: rgba(139, 118, 102, 0.08);
      color: var(--warm-text-soft);
    }

    .confirm-button {
      background: var(--warm-accent);
      color: #fff;
    }

    .secondary-button:hover {
      background: rgba(139, 118, 102, 0.12);
    }

    .confirm-button:hover {
      background: var(--warm-accent-deep);
    }

    .detail-header-card {
      padding: 18px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(61, 50, 43, 0.08);
    }

    .detail-cover {
      height: 120px;
      border-radius: 18px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .detail-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 22% 22%, rgba(255, 255, 255, 0.4), transparent 24%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
    }

    .detail-header-card h2 {
      margin: 0;
      color: var(--warm-text);
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
      word-break: break-word;
    }

    .detail-header-card p {
      margin: 10px 0 0;
      color: var(--warm-text-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .today-reminder {
      position: relative;
      margin-top: 18px;
      padding: 16px 46px 16px 18px;
      border-radius: 18px;
      background: rgba(232, 135, 124, 0.22);
      color: var(--warm-text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
      box-shadow: 0 8px 22px rgba(232, 135, 124, 0.12);
    }

    .readonly-banner {
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(212, 132, 106, 0.18);
      color: var(--warm-text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.6;
      box-shadow: 0 8px 22px rgba(61, 50, 43, 0.06);
    }

    .reminder-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.46);
      color: var(--warm-text-soft);
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .reminder-close:hover {
      background: rgba(255, 255, 255, 0.8);
      color: var(--warm-text);
    }

    .composer-card,
    .entry-card,
    .important-section {
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(61, 50, 43, 0.08);
    }

    .entry-textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px 16px;
      border: 1.5px solid var(--warm-border);
      border-radius: 14px;
      resize: vertical;
      background: rgba(250, 246, 241, 0.64);
      color: var(--warm-text);
      line-height: 1.7;
      outline: none;
      transition: border-color 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
    }

    .entry-textarea::placeholder {
      color: var(--warm-text-faint);
    }

    .entry-textarea:focus {
      border-color: var(--warm-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(212, 132, 106, 0.1);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .photo-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(212, 132, 106, 0.1);
      color: var(--warm-accent);
      cursor: pointer;
      font-size: 19px;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .photo-button:hover {
      transform: translateY(-1px);
      background: rgba(212, 132, 106, 0.16);
    }

    .publish-button {
      height: 42px;
      min-width: 92px;
      padding: 0 20px;
      border-radius: 20px;
      background: var(--warm-accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(212, 132, 106, 0.26);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .publish-button:hover {
      background: var(--warm-accent-deep);
      transform: translateY(-1px);
    }

    .thumb-grid,
    .entry-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .thumb-grid {
      margin-top: 12px;
    }

    .thumb,
    .entry-image-button {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(212, 132, 106, 0.08);
    }

    .thumb {
      position: relative;
    }

    .thumb img,
    .entry-image-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-remove {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(61, 50, 43, 0.62);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .timeline {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .entry-card {
      margin-top: 0;
      border-radius: 12px;
    }

    .entry-header {
      display: grid;
      grid-template-columns: 42px 1fr 34px;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }

    .entry-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--warm-accent-bg);
    }

    .entry-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .entry-author {
      margin: 0;
      color: var(--warm-text);
      font-size: 15px;
      font-weight: 800;
    }

    .entry-time {
      margin: 3px 0 0;
      color: var(--warm-text-soft);
      font-size: 12px;
    }

    .entry-delete {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(139, 118, 102, 0.08);
      color: var(--warm-text-soft);
      cursor: pointer;
      font-size: 18px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .entry-delete:hover {
      background: rgba(196, 90, 90, 0.1);
      color: var(--warm-danger);
    }

    .entry-content {
      margin: 0;
      color: var(--warm-text);
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .entry-images {
      margin-top: 12px;
    }

    .entry-image-button {
      padding: 0;
      cursor: zoom-in;
    }

    .important-section h3 {
      margin: 0 0 14px;
      color: var(--warm-text);
      font-size: 20px;
      font-weight: 800;
    }

    .important-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .important-card {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 10px;
      align-items: center;
      padding: 12px 12px 12px 14px;
      border-radius: 14px;
      background: rgba(250, 246, 241, 0.72);
      border: 1px solid var(--warm-border);
    }

    .important-date {
      margin: 0;
      color: var(--warm-text);
      font-size: 14px;
      font-weight: 800;
    }

    .important-desc {
      margin: 4px 0 0;
      color: var(--warm-text-soft);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .important-delete {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(139, 118, 102, 0.08);
      color: var(--warm-text-soft);
      cursor: pointer;
      transition: color 0.3s ease, background 0.3s ease;
    }

    .important-delete:hover {
      color: var(--warm-danger);
      background: rgba(196, 90, 90, 0.1);
    }

    .important-form {
      display: grid;
      grid-template-columns: 142px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .date-input,
    .important-desc-input {
      height: 40px;
      min-width: 0;
      padding: 0 12px;
      border: 1.5px solid var(--warm-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--warm-text);
      outline: none;
    }

    .small-coral-button {
      height: 40px;
      padding: 0 14px;
      border-radius: 14px;
      background: var(--warm-accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .small-coral-button:hover {
      background: var(--warm-accent-deep);
      transform: translateY(-1px);
    }

    .inline-empty {
      min-height: 180px;
      margin-top: 18px;
    }

    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(61, 50, 43, 0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-image {
      max-width: min(92vw, 840px);
      max-height: 82vh;
      border-radius: 18px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.28);
      object-fit: contain;
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 250, 245, 0.9);
      color: var(--warm-text);
      cursor: pointer;
      font-size: 22px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 22px;
      background: rgba(90, 78, 68, 0.92);
      color: #fff8ee;
      border-radius: 24px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 80vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 9999;
      white-space: pre-line;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 参考图风格覆盖：奶油手账、中心窄屏、柔和卡片 */
    :root {
      --warm-bg: #f7f3ec;
      --warm-bg-deep: #f0e8dc;
      --warm-card: #fffdf8;
      --warm-card-strong: #ffffff;
      --warm-card-glass: rgba(255, 253, 248, 0.96);
      --warm-text: #3c3026;
      --warm-text-soft: #9a8776;
      --warm-text-faint: rgba(60, 48, 38, 0.34);
      --warm-accent: #a9774d;
      --warm-accent-deep: #8f623e;
      --warm-accent-light: #d9b890;
      --warm-accent-bg: rgba(169, 119, 77, 0.12);
      --warm-border: rgba(110, 88, 69, 0.14);
      --warm-border-strong: rgba(110, 88, 69, 0.24);
      --warm-shadow: rgba(72, 55, 39, 0.07);
      --warm-shadow-lg: rgba(72, 55, 39, 0.14);
    }

    body {
      background:
        radial-gradient(circle at 18% 24%, rgba(221, 217, 205, 0.52) 0 34px, transparent 36px),
        radial-gradient(circle at 88% 8%, rgba(235, 223, 207, 0.72) 0 74px, transparent 76px),
        radial-gradient(circle at 4% 92%, rgba(232, 224, 211, 0.66) 0 66px, transparent 68px),
        #f3efe8;
    }

    #splashPage,
    #registerPage,
    #homePage,
    #detailPage {
      background:
        radial-gradient(circle at 6% 34%, rgba(224, 222, 212, 0.46) 0 32px, transparent 34px),
        radial-gradient(circle at 86% 11%, rgba(237, 227, 214, 0.78) 0 72px, transparent 74px),
        radial-gradient(circle at 3% 94%, rgba(229, 219, 205, 0.58) 0 58px, transparent 60px),
        linear-gradient(180deg, #f8f4ec 0%, #f6f1e9 100%);
    }

    #splashCanvas,
    .register-bg-canvas {
      opacity: 0.08;
      filter: blur(0.4px);
    }

    .splash-book-icon {
      position: absolute;
      left: 50%;
      top: 31%;
      width: 38px;
      height: 42px;
      transform: translate(-50%, 16px);
      opacity: 0;
      border-radius: 5px 8px 8px 5px;
      background:
        linear-gradient(90deg, #cfd7ef 0 45%, #f4eefc 45% 55%, #d7e8f1 55% 100%);
      box-shadow:
        inset 0 0 0 1px rgba(94, 103, 126, 0.14),
        0 10px 18px rgba(75, 62, 48, 0.09);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .splash-book-icon::before,
    .splash-book-icon::after {
      content: "";
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: rgba(105, 112, 133, 0.16);
    }

    .splash-book-icon::before {
      left: 13px;
    }

    .splash-book-icon::after {
      right: 13px;
    }

    .splash-book-icon span {
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 30px;
      height: 4px;
      border-radius: 50%;
      background: rgba(78, 61, 43, 0.08);
      transform: translateX(-50%);
    }

    .splash-title {
      top: calc(31% + 54px);
      color: #2f261e;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
      text-shadow: none;
      transform: translate(-50%, 16px);
    }

    .splash-subtitle {
      position: absolute;
      left: 50%;
      top: calc(31% + 92px);
      margin: 0;
      color: #a49282;
      font-size: 12px;
      line-height: 1.75;
      text-align: center;
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translate(-50%, 16px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      white-space: nowrap;
    }

    .enter-button {
      bottom: auto;
      top: calc(31% + 150px);
      min-width: 112px;
      height: 36px;
      padding: 0 24px;
      border: none;
      border-radius: 999px;
      background: #a9774d;
      color: #fffdf8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
      box-shadow: 0 10px 20px rgba(126, 83, 48, 0.22);
    }

    .enter-button:hover,
    .enter-button:focus-visible {
      background: #8f623e;
      color: #fffdf8;
      box-shadow: 0 14px 24px rgba(126, 83, 48, 0.26);
    }

    #splashPage.ready .splash-book-icon,
    #splashPage.ready .splash-subtitle {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .register-wrap {
      width: min(88vw, 360px);
      min-height: min(680px, calc(100vh - 40px));
      justify-content: center;
      gap: 16px;
      padding: 34px 22px 28px;
      border-radius: 0;
      background: rgba(255, 253, 248, 0.96);
      box-shadow: 0 12px 36px rgba(92, 75, 57, 0.08);
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .register-title {
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-indent: 0.04em;
    }

    .register-title::after {
      width: 26px;
      height: 3px;
      margin-top: 9px;
      background: #d3a776;
    }

    .avatar-title {
      margin: 4px 0 2px;
      color: var(--warm-text);
      font-size: 19px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .avatar {
      width: 138px;
      height: 138px;
      margin: 0 auto 12px;
      border: 1.5px solid rgba(169, 119, 77, 0.24);
      border-radius: 50%;
      background: #fffaf2;
      overflow: visible;
      box-shadow:
        inset 0 0 0 8px rgba(245, 235, 220, 0.52),
        0 12px 28px rgba(92, 75, 57, 0.08);
    }

    .avatar img {
      border-radius: 50%;
    }

    .avatar svg {
      width: 76px;
      height: 76px;
    }

    .avatar-plus {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #a9774d;
      color: #fffdf8;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(126, 83, 48, 0.24);
    }

    .text-input,
    .date-input,
    .important-desc-input,
    .entry-textarea {
      border: 1px solid rgba(129, 103, 82, 0.18);
      border-radius: 8px;
      background: #fffdf9;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .gender-option,
    .secondary-button {
      border-radius: 8px;
      background: #fbf4ec;
    }

    .primary-button,
    .confirm-button,
    .publish-button,
    .small-coral-button {
      border-radius: 999px;
      background: #a9774d;
      box-shadow: 0 9px 18px rgba(126, 83, 48, 0.18);
    }

    .primary-button:hover,
    .confirm-button:hover,
    .publish-button:hover,
    .small-coral-button:hover {
      background: #8f623e;
    }

    .app-shell {
      width: min(100%, 390px);
      min-height: 100%;
      margin: 0 auto;
      padding: 0 18px 104px;
      background: #fffdf8;
      box-shadow: 0 12px 40px rgba(92, 75, 57, 0.06);
    }

    .top-nav {
      max-width: 390px;
      background: linear-gradient(180deg, rgba(255, 253, 248, 0.98), rgba(255, 253, 248, 0.88));
    }

    .nav-avatar-button,
    .back-button,
    .share-button {
      background: #fff8ef;
      box-shadow: 0 4px 12px rgba(92, 75, 57, 0.08);
    }

    .nav-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
    }

    .home-content,
    .detail-content {
      max-width: 100%;
      padding-top: 22px;
    }

    .hero {
      margin-bottom: 18px;
    }

    .hero h2 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .hero p {
      margin-top: 6px;
      font-size: 12px;
    }

    .notebook-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      min-height: 78px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "name cover"
        "meta cover";
      align-items: center;
      padding: 14px 14px 14px 18px;
      border-radius: 12px;
      background: #ead5c2;
      box-shadow: none;
    }

    .card:nth-child(3n + 2) {
      background: #cfe2d7;
    }

    .card:nth-child(3n) {
      background: #ddd4ec;
    }

    .card-cover {
      grid-area: cover;
      width: 38px;
      height: 28px;
      margin: 0;
      border-radius: 8px;
      opacity: 0.88;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
    }

    .card-name {
      grid-area: name;
      font-size: 15px;
      font-weight: 900;
    }

    .card-meta {
      grid-area: meta;
      margin-top: 4px;
      font-size: 10px;
      gap: 1px;
    }

    .fab-button {
      min-width: 132px;
      height: 38px;
      bottom: calc(22px + env(safe-area-inset-bottom));
      border-radius: 999px;
      background: #a9774d;
      font-size: 12px;
      box-shadow: 0 12px 24px rgba(126, 83, 48, 0.23);
    }

    .modal {
      width: min(92vw, 338px);
      border-radius: 14px;
      background: #fffdf8;
      box-shadow: 0 22px 70px rgba(42, 35, 29, 0.28);
    }

    .modal h3 {
      text-align: center;
      font-size: 18px;
    }

    .color-dot {
      width: 28px;
      height: 28px;
    }

    .sidebar {
      width: min(78vw, 286px);
      border-radius: 0;
      background: #fffdf8;
      box-shadow: 18px 0 44px rgba(50, 42, 34, 0.16);
    }

    .sidebar-avatar {
      width: 72px;
      height: 72px;
      border-color: rgba(169, 119, 77, 0.18);
    }

    .detail-header-card,
    .composer-card,
    .entry-card,
    .important-section {
      border-radius: 12px;
      box-shadow: 0 7px 22px rgba(92, 75, 57, 0.07);
    }

    .detail-cover {
      height: 104px;
      border-radius: 12px;
    }

    .today-reminder,
    .readonly-banner {
      border-radius: 12px;
    }

    /* 主页与创建故事本：参考图迷你笔记本卡片和底部面板 */
    .notebook-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card.notebook-card {
      position: relative;
      min-height: 118px;
      display: block;
      padding: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #fffdf8;
      box-shadow: 0 12px 28px rgba(92, 75, 57, 0.08);
      border: none;
    }

    .notebook-card::before {
      content: "";
      position: absolute;
      left: 36px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(176, 86, 76, 0.24);
      z-index: 2;
    }

    .notebook-card-cover {
      position: relative;
      height: 70px;
      border-radius: 14px 14px 0 0;
      overflow: hidden;
      background: var(--cover-color, #efcbb3);
    }

    .notebook-card-cover::before {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 22px;
      height: 34px;
      background:
        linear-gradient(rgba(126, 92, 72, 0.14), rgba(126, 92, 72, 0.14)) 0 0 / 100% 1px no-repeat,
        linear-gradient(rgba(126, 92, 72, 0.14), rgba(126, 92, 72, 0.14)) 0 13px / 100% 1px no-repeat,
        linear-gradient(rgba(126, 92, 72, 0.14), rgba(126, 92, 72, 0.14)) 0 26px / 100% 1px no-repeat;
    }

    .notebook-card-title {
      position: absolute;
      left: 34px;
      top: 23px;
      z-index: 2;
      margin: 0;
      color: #4b3528;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.02em;
      max-width: calc(100% - 105px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-badge {
      position: absolute;
      top: 18px;
      right: 14px;
      z-index: 3;
      min-width: 42px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.86);
      color: #8f7b6d;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(72, 55, 39, 0.06);
    }

    .notebook-card-footer {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      background: #fffdf8;
      color: #9a8776;
      font-size: 12px;
    }

    .notebook-card-extra {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .notebook-card-arrow {
      color: #a9774d;
      font-weight: 900;
      font-size: 15px;
    }

    .fab-button {
      min-width: 146px;
      height: 44px;
      bottom: calc(34px + env(safe-area-inset-bottom));
      font-size: 14px;
      background: #c77848;
      box-shadow: 0 16px 34px rgba(178, 101, 55, 0.24);
    }

    .modal-overlay {
      align-items: end;
      place-items: end center;
      padding: 0;
      background: rgba(54, 48, 42, 0.46);
    }

    .modal {
      width: min(100%, 390px);
      max-height: 78vh;
      overflow-y: auto;
      padding: 20px 22px 28px;
      border-radius: 26px 26px 0 0;
      background: #fffdf8;
      transform: translateY(100%);
      box-shadow: 0 -20px 60px rgba(42, 35, 29, 0.18);
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background: #e5d8cb;
    }

    .modal h3 {

  <script>

    const pages = {
      splash: document.getElementById("splashPage"),

    };

    const canvas = document.getElementById("splashCanvas");
    const ctx = canvas.getContext("2d");
    const registerBgCanvas = document.getElementById("registerBgCanvas");
    const registerBgCtx = registerBgCanvas.getContext("2d");
    const enterButton = document.getElementById("enterButton");
    const avatarPicker = document.getElementById("avatarPicker");
    const avatarInput = document.getElementById("avatarInput");
    const avatarPreview = document.getElementById("avatarPreview");
    const nicknameInput = document.getElementById("nicknameInput");
    const registerForm = document.getElementById("registerForm");
    const formHint = document.getElementById("formHint");
    const genderButtons = [...document.querySelectorAll(".gender-option")];
    const notebookGrid = document.getElementById("notebookGrid");
    const emptyState = document.getElementById("emptyState");
    const createNotebookButton = document.getElementById("createNotebookButton");
    const createModalOverlay = document.getElementById("createModalOverlay");
    const notebookNameInput = document.getElementById("notebookNameInput");
    const colorPicker = document.getElementById("colorPicker");

    const previewNotebookName = document.getElementById("previewNotebookName");

    const exportDataButton = document.getElementById("exportDataButton");

    const shareButton = document.getElementById("shareButton");

    let appData = { user: null, notebooks: [] };

    function showPage(name) {
      Object.values(pages).forEach((page) => page.classList.remove("active"));
      pages[name].classList.add("active");
    }

    function safeParse(value) {
      try {
        return JSON.parse(value);
      } catch {
        return null;
      }
    }

    function normalizeNotebook(notebook) {
      const now = new Date().toISOString();
      return {
        id: notebook.id || createId(),
        name: notebook.name || "未命名本子",
        coverColor: notebook.coverColor || NOTEBOOK_COLORS[0],
        createdAt: notebook.createdAt || now,
        updatedAt: notebook.updatedAt || notebook.createdAt || now,
        entries: Array.isArray(notebook.entries) ? notebook.entries : [],
        importantDates: Array.isArray(notebook.importantDates) ? notebook.importantDates : [],
        shareToken: notebook.shareToken || createShareToken()
      };
    }

    function loadAppData() {
      const saved = safeParse(localStorage.getItem(DATA_KEY));
      if (saved?.user?.nickname) {
        return {
          user: {
            avatar: saved.user.avatar || "",
            nickname: saved.user.nickname || "",
            gender: saved.user.gender || ""
          },
          notebooks: Array.isArray(saved.notebooks) ? saved.notebooks.map(normalizeNotebook) : []
        };
      }

      const legacyUser = safeParse(localStorage.getItem(LEGACY_USER_KEY));
      if (legacyUser?.nickname) {
        return {
          user: {
            avatar: legacyUser.avatar || "",
            nickname: legacyUser.nickname || "",
            gender: legacyUser.gender || ""
          },
          notebooks: []
        };
      }

      return { user: null, notebooks: [] };
    }

    function saveAppData() {
      try {
        localStorage.setItem(DATA_KEY, JSON.stringify(appData));
        if (appData.user) {
          localStorage.setItem(LEGACY_USER_KEY, JSON.stringify(appData.user));
        }
        return true;
      } catch (e) {
        console.error("存储失败:", e);
        return false;
      }
    }

    function resizeCanvas() {
      const dpr = Math.max(window.devicePixelRatio || 1, 1);
      [canvas, registerBgCanvas].forEach((targetCanvas) => {
        const targetCtx = targetCanvas.getContext("2d");
        targetCanvas.width = Math.floor(window.innerWidth * dpr);
        targetCanvas.height = Math.floor(window.innerHeight * dpr);
        targetCanvas.style.width = `${window.innerWidth}px`;
        targetCanvas.style.height = `${window.innerHeight}px`;
        targetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      });

      if (pages.register.classList.contains("active")) {
        drawRegisterBackground();
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function drawPerson(targetCtx, x, y, scale, flip, alpha, variant = 0) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.scale(flip ? -scale : scale, scale);
      targetCtx.strokeStyle = `rgba(255, 248, 240, ${alpha})`;
      targetCtx.lineWidth = 1.6;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";

      if (variant === 1) {
        targetCtx.beginPath();
        targetCtx.moveTo(-10, -55);
        targetCtx.quadraticCurveTo(1, -69, 13, -55);
        targetCtx.quadraticCurveTo(16, -44, 9, -36);
        targetCtx.quadraticCurveTo(0, -30, -9, -36);
        targetCtx.quadraticCurveTo(-17, -44, -10, -55);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(-6, -34);
        targetCtx.quadraticCurveTo(-19, -24, -18, -1);
        targetCtx.quadraticCurveTo(-10, 10, -2, 9);
        targetCtx.quadraticCurveTo(8, 9, 18, -1);
        targetCtx.quadraticCurveTo(17, -24, 6, -34);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(-17, -18);
        targetCtx.quadraticCurveTo(-35, -6, -33, 13);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(16, -18);
        targetCtx.quadraticCurveTo(33, -4, 31, 15);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(-5, 9);
        targetCtx.quadraticCurveTo(-10, 32, -16, 54);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(5, 9);
        targetCtx.quadraticCurveTo(10, 31, 15, 54);
        targetCtx.stroke();
      } else {
        targetCtx.beginPath();
        targetCtx.moveTo(-11, -54);
        targetCtx.quadraticCurveTo(-3, -66, 10, -61);
        targetCtx.quadraticCurveTo(18, -55, 13, -42);
        targetCtx.quadraticCurveTo(6, -34, -4, -35);
        targetCtx.quadraticCurveTo(-15, -39, -11, -54);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(-6, -35);
        targetCtx.quadraticCurveTo(-13, -22, -11, -6);
        targetCtx.quadraticCurveTo(-4, 2, 2, 0);
        targetCtx.quadraticCurveTo(10, -2, 11, -16);
        targetCtx.quadraticCurveTo(9, -28, 5, -35);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(-10, -23);
        targetCtx.quadraticCurveTo(-26, -14, -31, 2);
        targetCtx.stroke();

      const width = window.innerWidth;
      const height = window.innerHeight;
      const centerY = height * 0.62;
      const scale = Math.min(Math.max(width / 430, 0.78), 1.12);
      const gap = Math.min(width * 0.15, 86);

      registerBgCtx.clearRect(0, 0, width, height);
      drawPerson(registerBgCtx, width / 2 - gap / 2, centerY, scale, false, 0.38, 0);
      drawPerson(registerBgCtx, width / 2 + gap / 2, centerY, scale, true, 0.38, 1);
    }

    function animateSplash(timestamp) {
      if (!animationStartedAt) animationStartedAt = timestamp;

      const width = window.innerWidth;
      const height = window.innerHeight;
      const elapsed = timestamp - animationStartedAt;
      const moveDuration = 1000;
      const holdDuration = 0;
      const rawProgress = Math.min(elapsed / moveDuration, 1);
      const progress = easeInOutCubic(rawProgress);
      const centerY = height * 0.62;
      const scale = Math.min(Math.max(width / 430, 0.78), 1.12);

      const leftStart = -70;
      const rightStart = width + 70;
      const gap = Math.min(width * 0.15, 86);
      const leftEnd = width / 2 - gap / 2;
      const rightEnd = width / 2 + gap / 2;

      const leftX = leftStart + (leftEnd - leftStart) * progress;
      const rightX = rightStart + (rightEnd - rightStart) * progress;

      ctx.clearRect(0, 0, width, height);
      drawPerson(ctx, leftX, centerY, scale, false, 0.72, 0);
      drawPerson(ctx, rightX, centerY, scale, true, 0.72, 1);

      if (elapsed >= moveDuration + holdDuration && !splashReady) {
        splashReady = true;
        pages.splash.classList.add("ready");
      }

      if (pages.splash.classList.contains("active")) {
        requestAnimationFrame(animateSplash);
      }
    }

    function startSplash() {
      splashReady = false;
      animationStartedAt = 0;
      pages.splash.classList.remove("ready");
      resizeCanvas();
      showPage("splash");
      requestAnimationFrame(animateSplash);
    }

    function relativeTime(value) {
      const time = new Date(value).getTime();
      if (Number.isNaN(time)) return "";
      const diff = Date.now() - time;
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (diff < minute) return "刚刚";
      if (diff < hour) return `${Math.floor(diff / minute)} 分钟前`;
      if (diff < day) return `${Math.floor(diff / hour)} 小时前`;
      if (diff < 7 * day) return `${Math.floor(diff / day)} 天前`;
      return formatDate(value);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener("load", () => resolve(reader.result));
        reader.addEventListener("error", reject);
        reader.readAsDataURL(file);
      });
    }

    function compressImage(file, maxSize, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          const cv = document.createElement("canvas");
          cv.width = width;
          cv.height = height;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          callback(cv.toDataURL("image/jpeg", quality));
        };
        img.onerror = function() { callback(null); };
        img.src = e.target.result;
      };
      reader.onerror = function() { callback(null); };
      reader.readAsDataURL(file);
    }

    function compressImageAsync(file, maxSize, quality) {
      return new Promise((resolve) => {
        compressImage(file, maxSize, quality, resolve);
      });
    }

    function compressDataUrl(dataUrl, maxSize, quality) {
      return new Promise((resolve) => {
        if (!dataUrl || !dataUrl.startsWith("data:image")) {
          resolve(dataUrl);
          return;
        }
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          const cv = document.createElement("canvas");
          cv.width = width;
          cv.height = height;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    async function prepareNotebookForShare(notebook) {

      const entries = shareNotebook.entries || [];
      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i];
        if (entry.images && entry.images.length) {
          const compressed = await Promise.all(
            entry.images.map((img) => compressDataUrl(img, 500, 0.6))
          );
          entry.images = compressed;
        }
      }
      return shareNotebook;
    }

    async function shortenUrl(longUrl) {
      const encoded = encodeURIComponent(longUrl);
      const tryFetch = async (serviceUrl) => {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        try {
          const resp = await fetch(serviceUrl, { signal: controller.signal, mode: "cors" });
          clearTimeout(timeoutId);
          if (resp.ok) {
            const short = (await resp.text()).trim();
            if (short.startsWith("http")) return short;
          }
        } catch { clearTimeout(timeoutId); }
        return null;
      };
      const services = [
        "https://is.gd/create.php?format=simple&url=" + encoded,
        "https://tinyurl.com/api-create.php?url=" + encoded
      ];
      return new Promise((resolve) => {
        let done = false;
        let pending = services.length;
        services.forEach(async (url) => {
          const result = await tryFetch(url);
          if (done) return;
          if (result) { done = true; resolve(result); }
          else if (--pending === 0) resolve(null);
        });
      });
    }

    async function shareNotebook() {
      const notebook = getCurrentNotebook();
      if (!notebook) return;

      const originalLabel = shareButton.textContent;
      shareButton.textContent = "⏳";
      shareButton.style.pointerEvents = "none";

      try {
        // 先估算原始数据大小，不大的话跳过压缩以节省时间
        const rawDataStr = JSON.stringify(notebook);
        const rawEncoded = btoa(unescape(encodeURIComponent(rawDataStr)));
        const NEED_COMPRESS = 200000;
        const MAX_ENCODED = 2000000;

        let shareNotebookData = notebook;
        let imagesStripped = false;

        if (rawEncoded.length > NEED_COMPRESS) {
          shareNotebookData = await prepareNotebookForShare(notebook);
        }

        const url = new URL(window.location.href);
        url.search = "";
        url.hash = "";

        let dataStr = JSON.stringify(shareNotebookData);
        let encoded = btoa(unescape(encodeURIComponent(dataStr)));

        if (encoded.length > MAX_ENCODED) {
          const lite = JSON.parse(JSON.stringify(shareNotebookData));
          lite.entries = (lite.entries || []).map((e) => ({ ...e, images: [] }));
          dataStr = JSON.stringify(lite);
          encoded = btoa(unescape(encodeURIComponent(dataStr)));
          imagesStripped = true;
        }

        url.searchParams.set("data", encoded);
        const longUrl = url.toString();

        // 立即复制长链接，不让用户等待
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(longUrl);
          }
        } catch {}

        shareButton.textContent = originalLabel;
        shareButton.style.pointerEvents = "";

        let baseMsg = isReadOnlyMode ? "链接已复制" : "分享链接已复制，可发送给他人打开";
        if (imagesStripped) {
          baseMsg += "\n\n（提示：故事本图片较多，分享链接中未包含图片。如需分享图片，建议减少条目图片数量）";
        }

        // 先提示用户链接已复制
        if (navigator.clipboard) {
          alert(baseMsg + "\n\n正在尝试生成更短的链接…如成功会自动更新剪贴板");
        } else if (navigator.share) {
          try {
            await navigator.share({ title: notebook.name, text: longUrl });
          } catch { alert(longUrl + "\n\n" + baseMsg); }
          return;
        } else {
          alert(longUrl + "\n\n" + baseMsg);
          return;
        }

        // 后台尝试生成短链接，成功则更新剪贴板
        try {
          const shortUrl = await shortenUrl(longUrl);
          if (shortUrl && navigator.clipboard) {
            await navigator.clipboard.writeText(shortUrl);
            const finalMsg = "短链接已生成并更新到剪贴板：\n" + shortUrl;
            showToast(finalMsg);
          }
        } catch {}
      } catch (e) {
        shareButton.textContent = originalLabel;
        shareButton.style.pointerEvents = "";
        alert("生成分享链接失败，请重试");
      }
    }

        button.addEventListener("click", () => {
          selectedCoverColor = color;
          renderColorPicker();
          updateNotebookPreview();
        });
        colorPicker.appendChild(button);
      });
    }

    function updateNotebookPreview() {
      const previewName = notebookNameInput.value.trim() || "故事本名称";
      notebookPreview.style.setProperty("--preview-color", selectedCoverColor);
      previewNotebookName.textContent = previewName;
    }

    function openCreateModal() {
      selectedCoverColor = NOTEBOOK_COLORS[(appData.notebooks.length || 0) % NOTEBOOK_COLORS.length];
      notebookNameInput.value = "";
      renderColorPicker();
      updateNotebookPreview();
      createModalOverlay.classList.add("open");
      createModalOverlay.setAttribute("aria-hidden", "false");
      window.setTimeout(() => notebookNameInput.focus(), 120);
    }

    function closeCreateModal() {
      createModalOverlay.classList.remove("open");
      createModalOverlay.setAttribute("aria-hidden", "true");
    }

    function createNotebook() {
      const name = notebookNameInput.value.trim();
      if (!name) {
        showHint(modalHint, "请输入手账本名称");
        notebookNameInput.focus();
        return;
      }

      const now = new Date().toISOString();
      appData.notebooks.unshift({
        id: createId(),
        name,
        coverColor: selectedCoverColor,
        createdAt: now,
        updatedAt: now,
        entries: [],
        importantDates: [],
        shareToken: createShareToken()
      });

      saveAppData();
      closeCreateModal();
      renderHome();
    }

    function openSidebar() {
      updateUserUI();
      sidebarOverlay.classList.add("open");
      sidebarOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSidebar() {
      sidebarOverlay.classList.remove("open");
      sidebarOverlay.setAttribute("aria-hidden", "true");
    }

    function logout() {
      localStorage.removeItem(DATA_KEY);
      localStorage.removeItem(LEGACY_USER_KEY);
      appData = { user: null, notebooks: [] };
      selectedGender = "";
      avatarBase64 = "";
      currentNotebookId = "";
      avatarInput.value = "";
      avatarPreview.removeAttribute("src");
      avatarPicker.classList.remove("has-image");
      nicknameInput.value = "";
      genderButtons.forEach((button) => {
        button.classList.remove("selected");
        button.setAttribute("aria-checked", "false");
      });
      closeSidebar();
      startSplash();
    }

    avatarInput.addEventListener("change", () => {
      const file = avatarInput.files?.[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showHint(formHint, "请选择图片文件");
        avatarInput.value = "";
        return;
      }

      compressImage(file, 256, 0.8, (result) => {
        if (result) {
          avatarBase64 = result;
          avatarPreview.src = avatarBase64;
          avatarPicker.classList.add("has-image");
        } else {
          showHint(formHint, "图片处理失败，请重试");
          avatarInput.value = "";
        }
      });
    });

    genderButtons.forEach((button) => {
      button.addEventListener("click", () => selectGender(button.dataset.gender));
    });

    registerForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const nickname = nicknameInput.value.trim();
      if (!nickname) {
        showHint(formHint, "请输入你的昵称");
        nicknameInput.focus();
        return;
      }

      appData.user = {
        avatar: avatarBase64,
        nickname,
        gender: selectedGender
      };
      appData.notebooks = Array.isArray(appData.notebooks) ? appData.notebooks : [];

      saveAppData();
      renderHome();
    });

    enterButton.addEventListener("click", () => {
      showPage("register");
      drawRegisterBackground();
      window.setTimeout(() => nicknameInput.focus(), 320);
    });

    createNotebookButton.addEventListener("click", openCreateModal);
    cancelCreateButton.addEventListener("click", closeCreateModal);
    confirmCreateButton.addEventListener("click", createNotebook);
    backHomeButton.addEventListener("click", renderHome);
    homeAvatarButton.addEventListener("click", openSidebar);
    shareButton.addEventListener("click", shareNotebook);
    exportDataButton.addEventListener("click", exportData);
    entryImageButton.addEventListener("click", () => entryImageInput.click());
    entryImageInput.addEventListener("change", handleEntryImages);
    publishEntryButton.addEventListener("click", publishEntry);
    addImportantDateButton.addEventListener("click", addImportantDate);
    closeReminderButton.addEventListener("click", () => {
      if (todayReminder.dataset.dismissKey) {
        sessionStorage.setItem(todayReminder.dataset.dismissKey, "1");
      }
      todayReminder.hidden = true;
    });
    lightboxCloseButton.addEventListener("click", closeLightbox);
    logoutButton.addEventListener("click", logout);

    createModalOverlay.addEventListener("click", (event) => {
      if (event.target === createModalOverlay) closeCreateModal();
    });

    lightboxOverlay.addEventListener("click", (event) => {
      if (event.target === lightboxOverlay) closeLightbox();
    });

    sidebarOverlay.addEventListener("click", (event) => {
      if (event.target === sidebarOverlay) closeSidebar();
    });

    sidebar.addEventListener("touchstart", (event) => {
      touchStartX = event.touches[0].clientX;
    }, { passive: true });

    sidebar.addEventListener("touchmove", (event) => {
      const currentX = event.touches[0].clientX;
      if (touchStartX - currentX > 55) closeSidebar();
    }, { passive: true });

    notebookNameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") createNotebook();
    });
    notebookNameInput.addEventListener("input", updateNotebookPreview);

    importantDescInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addImportantDate();
    });

    window.addEventListener("resize", resizeCanvas);

    function initializeApp() {
      appData = loadAppData();
      saveAppData();

      const queryParams = new URLSearchParams(window.location.search);
      const sharedData = queryParams.get("data");
      if (sharedData) {
        try {
          const decoded = decodeURIComponent(escape(atob(sharedData)));
          const sharedNotebook = normalizeNotebook(JSON.parse(decoded));
          if (sharedNotebook && sharedNotebook.id) {
            const existingIdx = appData.notebooks.findIndex((n) => n.id === sharedNotebook.id);
            if (existingIdx === -1) {
              appData.notebooks.push(sharedNotebook);
            }
            isReadOnlyMode = true;
            currentNotebookId = sharedNotebook.id;
            selectedEntryImages = [];
            updateUserUI();
            renderDetail();
            showPage("detail");
            return;
          }
        } catch (e) {
          console.error("解析分享数据失败:", e);
        }
      }

      if (routeToken) {
        const sharedNotebook = appData.notebooks.find((item) => item.shareToken === routeToken);
        if (sharedNotebook) {
          isReadOnlyMode = true;
          currentNotebookId = sharedNotebook.id;
          selectedEntryImages = [];
          updateUserUI();
          renderDetail();
          showPage("detail");
          return;
        }
        isReadOnlyMode = false;
      }

      if (appData.user?.nickname) {
        renderHome();
      } else {
        startSplash();
      }
    }

    initializeApp();
  </script>
</body>
</html>
